<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複習都OK | 我都OK啊頻道資料庫</title>
    <meta name="description" content="《我都OK啊》頻道影片搜尋，支援攝影主題關鍵字搜尋與 YouTube 時間跳轉。">
    <meta name="theme-color" content="#1c1c1a">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260830">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260905-natural-search">
    <link rel="stylesheet" href="site-shell.css?v=20260908">
</head>
<body>
    <!-- 誠實精確之 Glassmorphism 載入遮罩 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner-card">
            <div class="glass-spinner"></div>
            <div class="loading-title">正在準備搜尋資料...</div>
            <div class="loading-sub">首次載入可能需要幾秒鐘</div>
        </div>
    </div>

    <div class="app-container">
        <!-- 頁首 Top Bar -->
        <header class="top-header">
            <div class="header-left">
                <div class="status-pill">
                    <span class="live-dot"></span>
                    <span class="status-count" data-video-count>正在載入影片資料庫...</span>
                    <span class="status-updated" data-updated-date>更新日期載入中</span>
                </div>
            </div>
            <div class="header-right">
                <button id="themeToggleBtn" class="theme-toggle-btn" title="切換亮色/暗色主題">
                    <span class="theme-icon" aria-hidden="true">☀</span>
                    <span class="theme-text">亮色模式</span>
                </button>
            </div>
        </header>
        <nav class="mode-switch" aria-label="閱讀方式"><a data-mode-link="videos" href="./" aria-current="page">找影片</a><a data-mode-link="knowledge" href="wiki/roadmap.html">攝影知識地圖</a></nav>

        <!-- 主標題區段 (Strict Typography Hierarchy) -->
        <section class="hero-section">
            <h1 class="type-lvl-1">複習都OK</h1>
            <p class="type-lvl-4-sub">輸入器材、參數或攝影主題，搜尋全頻道影片與可回查的逐字稿段落</p>
            <div class="random-action-row">
                <button id="randomBtn" class="random-hero-btn" title="隨機抽取一部道慈老師影片">
                    <svg class="random-dice" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <rect x="3.5" y="3.5" width="17" height="17" rx="4.2"></rect>
                        <circle cx="8.2" cy="8.2" r="1.25"></circle>
                        <circle cx="15.8" cy="15.8" r="1.25"></circle>
                    </svg>
                    <span>隨機影片</span>
                    <svg class="random-dice" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <rect x="3.5" y="3.5" width="17" height="17" rx="4.2"></rect>
                        <circle cx="8.1" cy="8.1" r="1.15"></circle>
                        <circle cx="15.9" cy="8.1" r="1.15"></circle>
                        <circle cx="12" cy="12" r="1.15"></circle>
                        <circle cx="8.1" cy="15.9" r="1.15"></circle>
                        <circle cx="15.9" cy="15.9" r="1.15"></circle>
                    </svg>
                </button>
            </div>
        </section>

        <!-- 搜尋列與標籤 (Restraint & Density) -->
        <section class="search-section">
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" aria-label="搜尋攝影問題或關鍵字" placeholder="試試：星空對不到焦怎麼辦、GR3 街拍、光圈景深" autocomplete="off">
                <button id="clearBtn" class="clear-btn" style="display: none;" title="清除">✕</button>
                <button id="searchBtn" class="search-btn">
                    <span id="btnText">搜尋</span>
                </button>
            </div>

            <p id="searchInterpretation" class="search-interpretation" role="status" hidden></p>
            <div id="knowledgeSuggestions" class="knowledge-suggestions" aria-label="相關知識點" hidden></div>

            <!-- 熱門推薦微型標籤 -->
            <div class="tags-row">
                <span class="tags-label">熱門專題：</span>
                <button class="tag-pill" data-tag="Nikon Zf">Nikon Zf</button>
                <button class="tag-pill" data-tag="GR3 街拍">GR3 街拍</button>
                <button class="tag-pill" data-tag="ISO 感光度">ISO 感光度</button>
                <button class="tag-pill" data-tag="光圈 景深">光圈與景深</button>
                <button class="tag-pill" data-tag="HSL 調色">HSL 調色</button>
                <button class="tag-pill" data-tag="蔡司 鏡頭">蔡司鏡頭</button>
            </div>
        </section>

        <!-- 🚀 使用者權威五大分類導覽 Tabs -->
        <nav class="nav-tabs" id="categoryTabs">
            <button class="tab-pill active" data-cat="all">全頻道專題</button>
            <button class="tab-pill" data-cat="daily">日常影片</button>
            <button class="tab-pill" data-cat="gear">器材評測</button>
            <button class="tab-pill" data-cat="live">直播存檔</button>
            <button class="tab-pill" data-cat="member_review">會員評圖</button>
            <button class="tab-pill" data-cat="book">讀書會</button>
        </nav>

        <!-- 主要內容區域 -->
        <main class="main-content">
            <!-- 全頻道影片資料庫 -->
            <div class="content-header" id="mainContentHeader">
                <h2 id="sectionTitle" class="type-lvl-2">全頻道影片資料庫</h2>
                <span id="resultCount" class="type-lvl-5-count">載入資料中...</span>
            </div>

            <!-- 網格卡片區段 -->
            <div class="grid-layout" id="videoGrid">
                <!-- 由 app.js 動態渲染卡片 -->
            </div>
        </main>

        <!-- 頁尾 -->
        <footer class="app-footer">
            <p>《我都OK啊》YouTube 全頻道影片與逐字稿搜尋 ‧ 道慈老師攝影知識庫</p>
            <p class="footer-sub">靜態搜尋索引 · 資料來源：我都OK啊 YouTube 頻道</p>
        </footer>
    </div>

    <script src="knowledge-search.js?v=1"></script>
    <script src="app.js?v=20260927-keyword-search"></script>
    <script src="site-shell.js?v=20260911-reader"></script>
</body>
</html>
